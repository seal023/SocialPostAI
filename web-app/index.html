<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>SocialPostAI — Write once. Win every platform.</title>
  <meta name="description" content="SocialPostAI is the AI social media copy generator that creates platform-perfect posts for Instagram, TikTok, X, LinkedIn and Facebook in seconds. Get 1 free generation per day." />
  <meta name="keywords" content="AI social media post generator, platform-perfect copy, Instagram caption generator, TikTok script generator, LinkedIn post generator" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://socialpostai.app/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SocialPostAI — Write once. Win every platform." />
  <meta property="og:description" content="The AI social media copy generator that creates platform-perfect posts in seconds." />
  <meta property="og:url" content="https://socialpostai.app/" />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SocialPostAI — Write once. Win every platform." />
  <meta name="twitter:description" content="The AI social media copy generator that creates platform-perfect posts in seconds." />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />

  <!-- ===== Structured data: SoftwareApplication (SEO + GEO) ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "SocialPostAI",
    "url": "https://socialpostai.app",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Generate AI social media copy for Instagram, TikTok, X, LinkedIn, and Facebook. SocialPostAI is an AI social media post generator that writes platform-perfect copy in English and Chinese.",
    "offers": [
      {
        "@type": "Offer",
        "name": "Pro Monthly",
        "priceCurrency": "USD",
        "price": "5.99",
        "description": "Up to 50 AI generations per day across all platforms"
      },
      {
        "@type": "Offer",
        "name": "Pro Annual",
        "priceCurrency": "USD",
        "price": "49.99",
        "description": "Up to 50 AI generations per day across all platforms, billed yearly (save ~30%)"
      }
    ],
    "availableLanguage": ["English", "Chinese"]
  }
  </script>

  <!-- ===== Structured data: FAQPage (GEO long-tail capture) ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Does SocialPostAI support multiple languages?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes, it generates platform-perfect copy in both English and Chinese." }
      },
      {
        "@type": "Question",
        "name": "What platforms does this AI social media generator support?",
        "acceptedAnswer": { "@type": "Answer", "text": "It supports Instagram, TikTok, X, LinkedIn, and Facebook with native tone-tuning per network." }
      },
      {
        "@type": "Question",
        "name": "How much does SocialPostAI cost?",
        "acceptedAnswer": { "@type": "Answer", "text": "You get 1 free generation per day, and Pro plans are $5.99/month or $49.99/year." }
      },
      {
        "@type": "Question",
        "name": "Is the generated social media copy ready to post?",
        "acceptedAnswer": { "@type": "Answer", "text": "AI-generated drafts are tuned per platform and ready to review; always read them over before publishing." }
      }
    ]
  }
  </script>
</head>
<body>
  <!-- ===== Ambient nebula / aurora background (very subtle) ===== -->
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="grid"></span>
  </div>

  <!-- ===== Top navigation (minimal) ===== -->
  <header class="navbar">
    <div class="nav-inner">
      <a class="nav-brand" href="/">✨ SocialPostAI <span>Pro</span></a>
      <nav class="nav-links">
        <a class="nav-link" href="/app.html">App</a>
        <a class="nav-link" href="/app.html#pricing">Pricing</a>
        <a class="nav-link" href="/faq.html">FAQ</a>
      </nav>
    </div>
  </header>

  <!-- ===== Landing hero (centered, minimal) ===== -->
  <main class="landing">
    <section class="landing-hero">
      <h1 class="landing-title">Write once.<br />Win every platform.</h1>
      <p class="landing-sub">The AI social media copy generator that creates platform-perfect posts in seconds.</p>
      <a class="landing-cta" href="/app.html">Start Generating for Free</a>
    </section>
  </main>

  <!-- ===== Footer (compliance only) ===== -->
  <footer class="footer landing-footer">
    <nav class="footer-links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
    </nav>
    <p class="footer-fine">© <span id="year"></span> SocialPostAI Pro. AI-generated content is for reference only. Please review manually.</p>
  </footer>

  <!-- cookie consent + year helper (self-contained) -->
  <script src="/cookie.js"></script>
  <!-- Forward Creem return params (?email= etc.) to the app page so the Pro/welcome flow fires there. -->
  <script>
    (function () {
      var q = location.search;
      if (q && q.length > 1) { location.replace('/app.html' + q); }
    })();
  </script>
</body>
</html>
